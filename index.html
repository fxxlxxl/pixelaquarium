<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Aquarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#e4defa;--panel:#fff;--ink:#1f1a3d;--line:#2b2350;--acc:#ffd84a;--wood:#7a4b25;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112b;--panel:#221d45;--ink:#f1ecff;--line:#5a4ca8}}
:root[data-theme="dark"]{--bg:#14112b;--panel:#221d45;--ink:#f1ecff;--line:#5a4ca8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:10px/1.7 'Press Start 2P',ui-monospace,monospace;padding:14px}
main{max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:15px;margin:0}
#coins{background:var(--panel);border:3px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center}
.coin{width:10px;height:10px;background:#ffd84a;box-shadow:inset -2px -2px 0 #d9a21b,0 0 0 2px #1f1a3d;display:inline-block}
#tank{position:relative;aspect-ratio:16/9;border:8px solid var(--wood);box-shadow:0 0 0 3px #3d2512,0 8px 0 3px #2a190b,inset 0 0 0 3px #3d2512;background:#163c72;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#tank::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.12) 0 6%,transparent 6% 10%,rgba(255,255,255,.07) 10% 12%,transparent 12%)}
.nm{position:absolute;transform:translate(-50%,-100%);font-size:7px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;white-space:nowrap;pointer-events:none;z-index:2}
#sel{min-height:50px;margin:16px 0;background:var(--panel);border:3px solid var(--line);padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{font:inherit;padding:6px 8px;border:3px solid var(--line);background:var(--bg);color:var(--ink);width:150px}
button{font:inherit;cursor:pointer;background:var(--acc);color:#1f1a3d;border:3px solid #1f1a3d;padding:6px 10px;box-shadow:0 3px 0 #1f1a3d}
button:active{transform:translateY(3px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #39d6ff;outline-offset:2px}
.tabs{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:#39d6ff}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:var(--panel);border:3px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.card canvas{width:80px;height:72px;image-rendering:pixelated;background:linear-gradient(#46b4e6,#2873b8)}
.card button{width:100%;display:flex;gap:6px;justify-content:center;align-items:center}
#msg{min-height:18px;margin-top:12px;font-size:9px}
#set{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}#set button{padding:5px 8px;font-size:9px}#spd{width:120px;padding:0;border:0;background:none;vertical-align:middle}
#mp{background:var(--panel);border:3px solid var(--line);padding:10px;margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}#mp[hidden]{display:none}
.bdg{background:#e8384f;color:#fff;border-radius:9px;padding:0 5px;margin-left:6px;font-style:normal;font-size:8px}
.lvup{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:22px;color:#ffd84a;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:6;animation:lvu 2.6s ease-out forwards}
@keyframes lvu{0%{opacity:0;transform:translate(-50%,20px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
button,input,.card{touch-action:manipulation}body{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}#more{display:none}
@media(max-width:700px){#more{display:inline-block}#set.cl .mt{display:none}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}.tabs button{flex:0 0 auto}}
#fsx{display:none}
#tank.fs{position:fixed;inset:0;z-index:99;width:auto;aspect-ratio:auto;border:0;box-shadow:none!important;background:#050a1c}
#tank.fs::after{display:none}
#tank.fs #cv,#tank.fs #lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));width:min(100vw,calc(100dvh*16/9));height:min(100dvh,calc(100vw*9/16))}
#tank.fs #fsx{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;opacity:.75}
</style></head><body><main>

<div id="mp" hidden></div>
<div id="sel"></div>
<div class="tabs"><button class="on" data-t="f">Fische</button><button data-t="r">Seltene</button><button data-t="p">Pflanzen</button><button data-t="d">Deko</button><button data-t="b">Hintergründe</button><button data-t="fl">Boden</button><button data-t="fr">Rahmen</button><button data-t="ef">Effekte</button><button data-t="fd">Futter</button><button data-t="dex">Album</button><button data-t="ach">Erfolge</button><button data-t="ku">Kulisse</button><button data-t="up">Upgrades</button><button data-t="qu">Aufträge</button><button data-t="st">Statistik</button><button data-t="bw">Bewohner</button></div>
<div id="shbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><input id="shq" placeholder="Suche im Shop ..." aria-label="Shop durchsuchen" style="width:100%;max-width:300px"><button id="srt">Sortierung: Preis</button><button id="hdl">Gesperrtes: sichtbar</button></div>
<div id="shop"></div><div id="msg" role="status" aria-live="polite"></div>
</main>
